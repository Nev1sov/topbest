<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pocket Studio">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c0e14">
<meta name="format-detection" content="telephone=no">
<title>Pocket Studio</title>
<style>
:root{
  --bg:#0c0e14;--bg2:#12151d;--bg3:#1a1e29;--bg4:#242a38;--line:#2a3042;--tx:#e9edf6;--tx2:#98a2b8;--tx3:#6a7389;
  --ac:#ff7a3d;--ac2:#ffb347;--ok:#4fd18b;--rec:#ff4d5e;--blue:#4f9bff;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
#app{position:fixed;left:0;right:0;top:0;height:var(--vh,100vh);display:flex;flex-direction:column;padding-left:var(--sal);padding-right:var(--sar)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
button:active{filter:brightness(1.25)}
input,select{font:inherit;color:var(--tx);font-size:16px}
svg{display:block}
/* ---------- header ---------- */
#top{flex:none;display:flex;align-items:center;gap:6px;padding:calc(var(--sat) + 8px) 10px 8px;background:linear-gradient(#181c27,#12151d);border-bottom:1px solid var(--line)}
.ib{width:42px;height:42px;border-radius:12px;background:var(--bg4);display:flex;align-items:center;justify-content:center;flex:none;color:var(--tx)}
.ib svg{width:22px;height:22px;fill:currentColor}
.ib.big{background:linear-gradient(135deg,var(--ac),#ff4d6d);color:#fff;box-shadow:0 2px 10px rgba(255,100,60,.35)}
.ib.on{background:var(--ac);color:#111}
#bRec.arm{background:var(--rec);color:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.55}}
.bpm{display:flex;align-items:center;background:var(--bg3);border-radius:12px;height:42px;flex:none}
.bpm button{width:30px;height:42px;font-size:22px;color:var(--tx2)}
#bpmV{width:50px;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;color:var(--tx)}
#bpmV small{display:block;font-size:9px;font-weight:600;letter-spacing:.1em;color:var(--tx3);margin-top:-2px}
.sp{flex:1}
.chip{height:34px;padding:0 12px;border-radius:17px;background:var(--bg4);font-size:13px;font-weight:700;letter-spacing:.04em;display:inline-flex;align-items:center;gap:6px;flex:none;color:var(--tx2);white-space:nowrap}
.chip.on{background:var(--ac);color:#15110d}
.chip.sm{height:30px;padding:0 10px;font-size:12px}
#bMode{height:42px;border-radius:12px;padding:0 10px}
/* ---------- views ---------- */
#main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
.view.on{display:flex}
.scrollv{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px calc(20px + var(--sab))}
.row{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;padding:6px 10px;flex:none;-webkit-overflow-scrolling:touch}
.row::-webkit-scrollbar{display:none}
.tchip{height:34px;padding:0 12px 0 10px;border-radius:17px;background:var(--bg3);border:1.5px solid transparent;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;flex:none;color:var(--tx2);white-space:nowrap}
.tchip i{width:10px;height:10px;border-radius:50%;display:block}
.tchip.on{border-color:currentColor;color:var(--tx);background:var(--bg4)}
.tchip.add{color:var(--ac2);padding:0 12px}
.tool{height:36px;min-width:36px;padding:0 10px;border-radius:10px;background:var(--bg3);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:700;color:var(--tx2);flex:none;white-space:nowrap}
.tool svg{width:19px;height:19px;fill:currentColor}
.tool.on{background:var(--ac);color:#15110d}
.tool.dis{opacity:.35}
.tool b{color:var(--tx);font-weight:700}
.sepv{width:1px;height:22px;background:var(--line);flex:none;margin:0 2px}
.canvasbox{flex:1;min-height:0;position:relative;background:#0a0c11;border-top:1px solid var(--line)}
canvas{display:block;touch-action:none}
#insp{flex:none;display:none;align-items:center;gap:8px;padding:8px 10px;background:var(--bg2);border-top:1px solid var(--line);font-size:13px}
#insp.on{display:flex}
#insp .nm{font-weight:800;font-size:15px;min-width:40px}
#insp .lbl{color:var(--tx3);font-size:11px;font-weight:700;letter-spacing:.06em}
#hint{flex:none;padding:7px 12px;font-size:12px;color:var(--tx3);background:var(--bg2);border-top:1px solid var(--line);text-align:center}
/* ---------- tab bar ---------- */
#tabs{flex:none;display:flex;background:#10131a;border-top:1px solid var(--line);padding-bottom:var(--sab)}
#tabs button{flex:1;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:700;letter-spacing:.05em;color:var(--tx3)}
#tabs button svg{width:23px;height:23px;fill:currentColor}
#tabs button.on{color:var(--ac2)}
/* ---------- keys ---------- */
#kbwrap{flex:1;min-height:0;position:relative;margin:0 0 0 0}
#pads{display:none;flex:1;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px;min-height:0}
#pads button{border-radius:16px;background:var(--bg3);font-weight:800;font-size:15px;color:var(--tx2);border:1.5px solid var(--line);touch-action:none;display:flex;align-items:center;justify-content:center;text-align:center}
#pads button.hit{background:var(--ac);color:#15110d;border-color:var(--ac2)}
/* ---------- cards / mixer ---------- */
.card{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:12px;letter-spacing:.1em;color:var(--tx3);font-weight:800;text-transform:uppercase}
.strip .hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.strip .hd .dot{width:12px;height:12px;border-radius:50%;flex:none}
.strip input.nm{flex:1;min-width:0;background:transparent;border:0;font-weight:700;font-size:16px;padding:6px 2px;outline:0;color:var(--tx)}
.mini{height:32px;min-width:32px;padding:0 9px;border-radius:9px;background:var(--bg4);font-size:12px;font-weight:800;color:var(--tx2);display:inline-flex;align-items:center;justify-content:center;gap:5px;flex:none}
.mini.on{background:var(--ac);color:#15110d}
.mini.s.on{background:var(--ac2)}
.mini svg{width:16px;height:16px;fill:currentColor}
.sl{display:grid;grid-template-columns:80px 1fr 46px;align-items:center;gap:8px;height:34px}
.sl label{font-size:11px;font-weight:700;letter-spacing:.03em;line-height:1.15;color:var(--tx3);text-transform:uppercase}
.sl output{font-size:12px;color:var(--tx2);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(90deg,var(--c,var(--ac)) var(--p,50%),var(--bg4) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;margin-top:-9.5px;box-shadow:0 1px 5px rgba(0,0,0,.5)}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:var(--bg4)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:0}
.instbtn{display:flex;align-items:center;justify-content:space-between;width:100%;height:42px;padding:0 12px;border-radius:12px;background:var(--bg3);font-weight:700;font-size:14px;margin-bottom:6px}
.instbtn span{color:var(--tx3);font-size:11px;font-weight:700;letter-spacing:.06em}
.btn{height:46px;border-radius:13px;background:var(--bg4);font-weight:700;font-size:15px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--tx)}
.btn.pri{background:linear-gradient(135deg,var(--ac),#ff4d6d);color:#fff}
.btn.full{width:100%}
.btn svg{width:20px;height:20px;fill:currentColor}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.meter{height:8px;border-radius:4px;background:var(--bg4);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok),var(--ac2) 75%,var(--rec));transition:width .05s linear}
/* ---------- song ---------- */
.seg{display:flex;background:var(--bg3);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:38px;border-radius:9px;font-weight:800;font-size:13px;letter-spacing:.05em;color:var(--tx3)}
.seg button.on{background:var(--ac);color:#15110d}
.pats{display:flex;flex-wrap:wrap;gap:8px}
.pat{width:54px;height:54px;border-radius:14px;background:var(--bg3);border:2px solid transparent;font-weight:800;font-size:18px;color:var(--tx2)}
.pat.on{border-color:var(--ac2);color:var(--tx);background:var(--bg4)}
.pat.add{color:var(--ac2);font-size:26px;font-weight:400}
.chain{display:flex;flex-wrap:wrap;gap:6px}
.blk{min-width:44px;height:44px;border-radius:11px;background:var(--bg4);border:2px solid transparent;font-weight:800;font-size:15px;color:var(--tx);padding:0 8px}
.blk.on{border-color:var(--ac2)}
.blk.play{background:var(--ac);color:#15110d}
/* ---------- sheet ---------- */
#sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:20;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
#sheetbg.on{display:block}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:82%;background:var(--bg2);border-radius:22px 22px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;padding-bottom:var(--sab);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
#sheet .sh b{font-size:17px}
#sheet .sb{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px 18px}
.cat{margin:10px 0 6px;font-size:11px;letter-spacing:.1em;font-weight:800;color:var(--tx3);text-transform:uppercase}
.gridc{display:flex;flex-wrap:wrap;gap:8px}
.opt{height:42px;padding:0 14px;border-radius:12px;background:var(--bg3);font-weight:700;font-size:14px;color:var(--tx2);border:1.5px solid transparent}
.opt.on{background:var(--bg4);border-color:var(--ac2);color:var(--tx)}
.numin{width:100%;height:56px;border-radius:14px;background:var(--bg3);border:1.5px solid var(--line);text-align:center;font-size:30px;font-weight:800;outline:0;color:var(--tx);margin-bottom:10px}
#toast{position:fixed;left:50%;bottom:calc(76px + var(--sab));transform:translateX(-50%) translateY(20px);background:#222836;border:1px solid var(--line);color:var(--tx);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:88%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:50;background:radial-gradient(ellipse at 50% 30%,#232a3f,#0c0e14 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px;transition:opacity .4s}
#splash.hide{opacity:0;pointer-events:none}
#splash .logo{width:92px;height:92px;border-radius:24px;background:linear-gradient(135deg,var(--ac),#ff4d6d);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 40px rgba(255,90,60,.4)}
#splash .logo svg{width:52px;height:52px;fill:#fff}
#splash h1{margin:6px 0 0;font-size:32px;letter-spacing:.04em}
#splash p{margin:0;color:var(--tx2);font-size:15px;line-height:1.5;max-width:300px}
#splash .go{margin-top:12px;height:54px;padding:0 44px;border-radius:27px;background:linear-gradient(135deg,var(--ac),#ff4d6d);font-weight:800;font-size:17px;letter-spacing:.06em;color:#fff}
#splash small{color:var(--tx3);font-size:12px;max-width:290px;line-height:1.5}
.help h4{margin:14px 0 4px;font-size:14px;color:var(--ac2)}
.help p,.help li{font-size:13.5px;line-height:1.55;color:var(--tx2);margin:0 0 4px}
.help ul{margin:0 0 6px;padding-left:18px}
.kv{display:flex;justify-content:space-between;font-size:13px;color:var(--tx2);padding:5px 0;border-bottom:1px solid var(--line)}
.kv b{color:var(--tx)}
textarea,input[type=text]{font-size:16px}
.txt{width:100%;height:46px;border-radius:12px;background:var(--bg3);border:1.5px solid var(--line);padding:0 12px;color:var(--tx);outline:0;font-weight:600}
audio{width:100%;margin:10px 0}
.prog{height:6px;border-radius:3px;background:var(--bg4);overflow:hidden;margin:10px 0}
.prog i{display:block;height:100%;width:30%;background:linear-gradient(90deg,var(--ac),var(--ac2));animation:ind 1.1s infinite ease-in-out}
@keyframes ind{0%{margin-left:-30%}100%{margin-left:100%}}

#insp .sp{flex:1}
#insp{gap:6px;padding:8px}
#insp .nm{min-width:34px;font-size:14px}
#insp .mini{min-width:30px;padding:0 7px}
#insp input[type=range]{height:26px}
.btn.dis{pointer-events:none}
label.btn{cursor:pointer}
#rowKeyTools{min-height:48px}
#top{gap:5px;padding-left:8px;padding-right:8px}
#top .ib{width:40px;height:40px}
#top .ib.big{width:44px}
.bpm button{width:26px}
#bpmV{width:46px}
#bMode{padding:0 7px;font-size:11px;min-width:0}#top{gap:4px}#top .ib{width:38px}.bpm{padding:0 2px}#bpmV{width:42px}
#bSave{position:relative}
#bSave.dirty::after{content:"";position:absolute;right:6px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--ac2)}
@media(max-width:380px){#top{gap:3px}#top .ib{width:36px}#top .ib.big{width:40px}.bpm button{width:22px}#bpmV{width:42px}}
#pads{grid-template-columns:repeat(4,1fr)}
.pchip{min-width:36px;height:34px;padding:0 10px;border-radius:11px;background:var(--bg3);font-weight:800;font-size:14px;color:var(--tx2);border:1.5px solid transparent;flex:none}
.pchip.on{border-color:var(--ac2);color:var(--tx);background:var(--bg4)}
.pchip.add{color:var(--ac2);font-size:20px;font-weight:400}
@media(max-height:760px){#hint{display:none}}
.mini.dis{opacity:.35}
.smp{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.smp b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.smp span{color:var(--tx3);font-size:12px}
#insp{overflow-x:auto;scrollbar-width:none}
#insp::-webkit-scrollbar{display:none}
#insp>*{flex:none}
#insp>input[type=range]{flex:1 0 70px}

</style>
</head>
<body>
<div id="app">
  <header id="top">
    <button class="ib big" id="bPlay" aria-label="Play"></button>
    <button class="ib" id="bStop" aria-label="Stop"></button>
    <button class="ib" id="bRec" aria-label="Record"></button>
    <div class="bpm"><button id="bpmM" aria-label="Slower">&minus;</button><button id="bpmV">110<small>BPM</small></button><button id="bpmP" aria-label="Faster">+</button></div>
    <div class="sp"></div>
    <button class="ib" id="bMet" aria-label="Metronome"></button>
    <button class="chip" id="bMode">PAT</button>
    <button class="ib sv" id="bSave" aria-label="Save"></button>
  </header>
  <main id="main">
    <section class="view on" id="v-roll">
      <div class="row" id="rowTracks"></div>
      <div class="row" id="rowPats" style="padding-bottom:0"></div>
      <div class="row" id="rowTools" style="padding-top:0"></div>
      <div class="canvasbox" id="rollbox"><canvas id="roll"></canvas></div>
      <div id="insp"></div>
      <div id="hint"></div>
    </section>
    <section class="view" id="v-keys">
      <div class="row" id="rowTracks2"></div>
      <div class="row" id="rowKeyTools" style="padding-top:0"></div>
      <div id="kbwrap" class="canvasbox"><canvas id="kb"></canvas></div>
      <div id="pads"></div>
    </section>
    <section class="view" id="v-mix"><div class="scrollv" id="mixList"></div></section>
    <section class="view" id="v-song"><div class="scrollv" id="songBody"></div></section>
    <section class="view" id="v-file"><div class="scrollv" id="fileBody"></div></section>
  </main>
  <nav id="tabs">
    <button data-tab="roll" class="on"></button>
    <button data-tab="keys"></button>
    <button data-tab="mix"></button>
    <button data-tab="song"></button>
    <button data-tab="file"></button>
  </nav>
</div>
<div id="sheetbg"><div id="sheet"><div class="sh"><b id="shT"></b><button class="chip sm" id="shX">Done</button></div><div class="sb" id="shB"></div></div></div>
<div id="toast"></div>
<div id="splash">
  <div class="logo" id="logo"></div>
  <h1>Pocket Studio</h1>
  <p>Make beats, melodies and full songs on your phone. 24 instruments, drum kits, mixer, song mode &mdash; and export to WAV or MIDI.</p>
  <button class="go" id="splashGo">TAP TO START</button>
  <small>Turn the volume up and make sure silent mode is off. Everything is synthesized right on your device &mdash; no downloads, works offline.</small>
</div>
<script>
/* ============================================================
   POCKET STUDIO — audio engine (all sounds are synthesized, no samples)
   ============================================================ */
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const noteName = m => NOTE_NAMES[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1);
const isBlack = m => { const k = ((m % 12) + 12) % 12; return k === 1 || k === 3 || k === 6 || k === 8 || k === 10; };
const MIDI_LO = 21, MIDI_HI = 108;            // full 88-key range A0..C8

function seeded(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

/* ---------- drum map ---------- */
const DRUMS = [
  { p: 36, n: 'Kick' }, { p: 38, n: 'Snare' }, { p: 39, n: 'Clap' }, { p: 42, n: 'Hi-Hat' }, { p: 46, n: 'Open Hat' }, { p: 37, n: 'Rim' },
  { p: 41, n: 'Low Tom' }, { p: 45, n: 'Mid Tom' }, { p: 48, n: 'High Tom' }, { p: 56, n: 'Cowbell' }, { p: 52, n: 'Cow Soft' }, { p: 53, n: 'Cow Metal' }, { p: 54, n: 'Cow Sharp' }, { p: 55, n: 'Cow Tone' }, { p: 51, n: 'Ride' }, { p: 49, n: 'Crash' }
];
const KITS = ['Studio', '808', 'Lo-Fi', 'Trap', 'Drift Phonk'];

/* ---------- per-context helpers ---------- */
function ctxCache(c) {
  if (c._pc) return c._pc;
  const r = seeded(12345), len = c.sampleRate * 2, nb = c.createBuffer(1, len, c.sampleRate), d = nb.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = r() * 2 - 1;
  const cache = { noise: nb, waves: {} };
  const sat = new Float32Array(2048); for (let i = 0; i < 2048; i++) { const x = i / 1024 - 1; sat[i] = Math.tanh(x * 2.4) / Math.tanh(2.4); } cache.sat = sat; cache.hard = shapeCurve(4.2, 0); cache.samples = {};
  c._pc = cache; return cache;
}
function shapeCurve(k, bias) {
  const n = 2048, a = new Float32Array(n), b = bias || 0, tb = Math.tanh(k * b), sc = 1 / Math.max(Math.abs(Math.tanh(k * (1 + b)) - tb), Math.abs(Math.tanh(k * (-1 + b)) - tb));
  for (let i = 0; i < n; i++) { const x = i / (n - 1) * 2 - 1; a[i] = (Math.tanh(k * (x + b)) - tb) * sc; } return a;
}
function glide(osc, f, t, o, k) { if (o && o.gl) { const kk = k || 1; osc.frequency.cancelScheduledValues(t); osc.frequency.setValueAtTime(mtof(o.gl.from) * kk, t); osc.frequency.exponentialRampToValueAtTime(f * kk, t + Math.max(0.012, o.gl.t)); } }
function decodeSampleToBuffer(c, sm) {
  const bin = atob(sm.d), n = bin.length >> 1, b = c.createBuffer(1, Math.max(1, n), sm.sr), d = b.getChannelData(0);

  bk.forEach(x => { const d = new Date(x.t), b = el('button', 'btn full', esc(x.name || 'Project') + ' · ' + d.toLocaleDateString() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + ' · ' + (x.json.length / 1024 | 0) + ' KB'); b.style.marginBottom = '8px'; b.onclick = () => { try { const pr = sanitizeProject(JSON.parse(x.json)); closeSheet(); newDemoKeep(pr); toast(T('Backup restored', 'Копия восстановлена')); } catch (e) { toast(T('Backup is damaged', 'Копия повреждена')); } }; box.appendChild(b); });
  openSheet(T('Backups', 'Резервные копии'), box);
}
function newDemoKeep(pr) { snapshot(); const keep = U.undo.slice(); setProject(pr); U.undo = keep; updateUndoBtns(); showTab('roll'); }

/* ---------- guide: new sections ---------- */
ABOUT.en.splice(3, 0,
  ['Automation (volume & filter)', '<p>On the EDIT tab press <b>Auto</b>. A lane opens under the notes. Pick <b>Volume</b> or <b>Filter</b>, then <b>Draw</b> with your finger — or use <b>Line</b>: press where the change starts, drag to where it ends, release. A pad that slowly fades in = a rising volume line. A bass that “opens up” (wah-wah) = a rising filter line; raise <b>Filter res</b> in MIX → Sound design for a stronger wah. Every track has its own lanes in every pattern.</p>'],
  ['Your own samples', '<p>Press <b>+ Track → Sampler</b> (or FILE → Your samples) and load a short WAV / MP3 / M4A from your phone. The sample plays on the grid like an instrument: the <b>Root note</b> plays it as recorded and other notes change its pitch. Use <b>Pitch</b> for fine tuning, <b>One-shot</b> for drums and <b>Hold</b> to cut it with the note length. Samples are stored in the project.</p>'],
  ['808 glide, distortion, layers', '<p>Select a bass note and press <b>~ Slide</b> — the note glides in from the previous one (set the speed in MIX → Sound design → Slide time). <b>Distortion</b> is aggressive clipping, <b>Saturation</b> is thicker warm overload, <b>Bass boost</b> is a low-shelf EQ (per track and for the whole mix). <b>Layer</b> adds a second instrument on top of every note — for example 808 Bass + 808 Top (growl), one octave up.</p>'],
  ['Copy & paste', '<p><b>Select</b> tool: drag a box around notes (or tap them), then <b>Copy</b>, <b>Paste</b>, <b>Repeat ▸</b>, transpose or delete. In drums use <b>Copy bar / Paste bar / Fill all bars</b>. <b>Copy pattern</b> (top of EDIT) makes an exact duplicate of the whole pattern; <b>Copy into…</b> (SONG) overwrites another pattern. Tap the selected track chip → <b>Duplicate</b> clones a track with all notes and settings, <b>Copy notes to…</b> sends its notes to another pattern.</p>'],
  ['Drift Phonk kit & cowbells', '<p>Drum tracks have a <b>Drift Phonk</b> kit (tap <b>Kit</b> on the EDIT tab): a distorted kick, hard snare and crisp hats. There are 5 cowbell pads (classic, soft, metal, sharp, tone) and 4 pitched cowbell instruments — Soft, Metal, Sharp, Melodic — for playing cowbell melodies.</p>']
);
ABOUT.ru.splice(3, 0,
  ['Автоматизация (громкость и фильтр)', '<p>На вкладке EDIT нажми <b>Авто</b>. Под нотами откроется дорожка автоматизации. Выбери <b>Громкость</b> или <b>Фильтр</b> и <b>рисуй</b> пальцем — или возьми <b>Линию</b>: нажми там, где начинается изменение, протяни до конца и отпусти. Пэд, который плавно нарастает = линия громкости вверх. Бас, который «открывается» (вау-вау) = линия фильтра вверх; для более сильного эффекта подними <b>Резонанс</b> в MIX → Звук. У каждой дорожки свои линии в каждом паттерне.</p>'],
  ['Свои сэмплы', '<p>Нажми <b>+ Дорожка → Сэмплер</b> (или FILE → Твои сэмплы) и загрузи короткий WAV / MP3 / M4A с телефона. Сэмпл играет по сетке как инструмент: нота <b>Root</b> — как в оригинале, остальные меняют высоту. <b>Высота</b> — точная подстройка, <b>Целиком</b> — для ударных, <b>По длине ноты</b> — звук обрезается вместе с нотой. Сэмплы хранятся внутри проекта.</p>'],
  ['808 glide, дисторшн, слои', '<p>Выбери ноту баса и нажми <b>~ Slide</b> — нота плавно скользит от предыдущей (скорость — MIX → Звук → Время glide). <b>Дисторшн</b> — агрессивное искажение, <b>Сатурация</b> — плотный тёплый перегруз, <b>Бас-буст</b> — низкочастотный эквалайзер (на дорожке и на всём миксе). <b>Слой</b> добавляет второй инструмент поверх каждой ноты — например, 808 Bass + 808 верх (рычание) на октаву выше.</p>'],
  ['Копирование', '<p>Инструмент <b>Выбор</b>: обведи ноты рамкой (или нажимай на них), затем <b>Копия</b>, <b>Вставить</b>, <b>Повтор ▸</b>, транспонирование или удаление. В ударных — <b>Копия такта / Вставить / Во все такты</b>. <b>Копия паттерна</b> (сверху на EDIT) делает точный дубль всего паттерна; <b>Скопировать в…</b> (SONG) перезаписывает другой паттерн. Нажми на выбранную дорожку → <b>Копия</b> клонирует дорожку со всеми нотами и настройками, <b>Копировать ноты в…</b> переносит её ноты в другой паттерн.</p>'],
  ['Набор Drift Phonk и ковбеллы', '<p>У дорожки ударных есть набор <b>Drift Phonk</b> (кнопка <b>Набор</b> на вкладке EDIT): рваный кик, жёсткий снейр и чёткие хэты. Есть 5 падов-ковбеллов (классический, мягкий, металлический, резкий, тональный) и 4 мелодических ковбелла-инструмента — для ковбелл-мелодий.</p>']
);

/* ============================================================

function frame() {
  requestAnimationFrame(frame);
  if (U.tab === 'roll') { if (R.dirty || TR.playing) { drawRoll(); R.dirty = false; } }
  else if (U.tab === 'keys') { if (K.dirty || TR.playing) { drawKeys(); K.dirty = false; } }
  else if (U.tab === 'mix') meterTick(); else if (U.tab === 'song') songTick();
}
async function boot() {
  P = await loadInitial(); updateSaveBtn(); $('#logo').innerHTML = ic('note'); applyLang(); R.centered = false;
  renderAll(); showTab('roll'); resizeRoll(); requestAnimationFrame(frame);
  $('#splashGo').addEventListener('click', () => { ensureAudio(); $('#splash').classList.add('hide'); setTimeout(() => { $('#splash').style.display = 'none'; }, 450); setTimeout(() => toast(T('Tap the grid to add notes, then press play', 'Нажми на сетку, чтобы добавить ноты, затем play'), 3200), 600); });
  $('#bSave').addEventListener('click', () => saveNow(true));
  setInterval(() => { if (U.dirty) saveNow(false); }, 5000);
  window.addEventListener('pagehide', saveSync); document.addEventListener('visibilitychange', () => { if (document.hidden) { saveSync(); if (TR.playing) pause(); } });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  window.__ps = { P: () => P, R, K, U, TR, eng: () => eng, AC: () => AC, play, stopAll, showTab, openExport, renderAll, setProject, keyAt, addNoteAt, drawRoll, drawKeys, saveNow, encodeMp3, fileToSample, renderAudio, demoDrift, demoPhonk, sanitizeProject };
}
boot();
